name: Release on Version Update

on:
  push:
    branches: [26.1.2]
    paths:
      - 'gradle.properties'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if mod_version changed
        id: version_check
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if git diff "$BEFORE" "$AFTER" -- gradle.properties | grep -q '^[+-]mod_version='; then
            MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
            MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2)
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
            echo "mc_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup JDK 21
        if: steps.version_check.outputs.version_changed == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Make gradle wrapper executable
        if: steps.version_check.outputs.version_changed == 'true'
        run: chmod +x ./gradlew

      - name: Build with Gradle
        if: steps.version_check.outputs.version_changed == 'true'
        run: ./gradlew build

      - name: Rename jar artifacts
        if: steps.version_check.outputs.version_changed == 'true'
        shell: bash
        run: |
          MC_VER="${{ steps.version_check.outputs.mc_version }}"
          MOD_VER="${{ steps.version_check.outputs.mod_version }}"
          for f in build/libs/*.jar; do
            if [ -f "$f" ]; then
              dir=$(dirname "$f")
              base=$(basename "$f")
              # Replace project name prefix with minecraft version
              newname=$(echo "$base" | sed "s/^league-of-crafters-/${MC_VER}-/")
              mv "$f" "$dir/$newname"
            fi
          done

      - name: Create Release
        if: steps.version_check.outputs.version_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_check.outputs.mod_version }}
          name: Release v${{ steps.version_check.outputs.mod_version }}
          body: "Release version ${{ steps.version_check.outputs.mod_version }} for Minecraft ${{ steps.version_check.outputs.mc_version }}"
          files: build/libs/*.jar
          draft: false
          prerelease: false
